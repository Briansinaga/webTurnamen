<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turnamen Mobile Legends - Official</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0e27;
      color: #fff;
      overflow-x: hidden;
    }

    /* ======= Navbar ======= */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 0;
      background: rgba(10, 14, 39, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .navbar:hover {
      background: rgba(10, 14, 39, 0.95);
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 40px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #ffd700, #ffed4e);
      transition: width 0.3s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd700;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    /* ======= Hero Section ======= */
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(60%);
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(10, 14, 39, 0.7), rgba(30, 20, 60, 0.6));
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 900px;
      padding: 40px;
      text-align: center;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
      letter-spacing: 2px;
      font-weight: 800;
    }

    .hero p {
      font-size: 1.3rem;
      margin-bottom: 40px;
      color: #e6e6e6;
      line-height: 1.6;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
    }

    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      color: #0a0e27;
      padding: 16px 50px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .cta::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .cta:hover::before {
      width: 300px;
      height: 300px;
    }

    .cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
    }

    /* ======= Container Section ======= */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 30px;
      background: linear-gradient(180deg, #0a0e27, #1a1e3f);
    }

    .container h2 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      text-align: center;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      padding-bottom: 20px;
    }

    .container h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
      border-radius: 2px;
    }

    .container p {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #d1d5db;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ======= Responsive ======= */
    @media (max-width: 768px) {
      .nav-inner {
        flex-direction: column;
        gap: 20px;
      }

      .nav-links {
        gap: 20px;
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      .hero p {
        font-size: 1.1rem;
      }

      .cta {
        padding: 14px 40px;
        font-size: 1rem;
      }

      .container h2 {
        font-size: 2rem;
      }

      .container p {
        font-size: 1rem;
      }
    }

    /* ======= Animasi Partikel ======= */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 215, 0, 0.6);
      border-radius: 50%;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(50px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">Turnamen ML • Class Tournament</div>
      <nav>
        <div class="nav-links">
          <a href="#home" class="active">Home</a>
          <a href="https://challonge.com/tournaments/bracket_generator.html" target="_blank">Jadwal</a>
          <a href="https://challonge.com/tournaments/bracket_generator.html" target="_blank">Bagan</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <img src="WhatsApp Image 2025-11-09 at 22.09.36_0c562efb.jpg" alt="Poster Turnamen ML">
    <div class="hero-overlay"></div>
    <div class="particles" id="particles"></div>
    <div class="hero-content">
      <h1>Turnamen Mobile Legends</h1>
      <p>Ikuti Class Tournament Mobile Legends dan buktikan siapa tim terkuat di kampusmu!</p>
      <a class="cta" href="https://forms.gle/c7L76a6mLgeZKzZHA" target="_blank" rel="noopener">Daftar Sekarang</a>
    </div>
  </section>



  <script>
    // Generate particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (Math.random() * 6 + 6) + 's';
      particlesContainer.appendChild(particle);
    }

    // Smooth scroll for navigation
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });
  </script>
</body>
</html>
